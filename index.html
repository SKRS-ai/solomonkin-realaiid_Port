<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarborLink Partners | Bureau of Digital Identity</title>
    <style>
        :root { --navy: #002366; --light-blue: #00a8e8; --white: #ffffff; --bg-gray: #f4f7f6; --text-dark: #2d3436; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.7; color: var(--text-dark); margin: 0; background-color: var(--bg-gray); }
        
        /* Header */
        header { background: var(--navy); padding: 0.5rem 5%; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid var(--light-blue); }
        .logo-box img { height: 240px; width: auto; }
        nav { display: flex; gap: 30px; }
        nav a { color: var(--white); text-decoration: none; font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 1.5px; }

        /* Dynamic Hero Slider */
        .hero { position: relative; height: 500px; width: 100%; overflow: hidden; background: var(--navy); display: flex; align-items: center; justify-content: center; }
        .hero-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; animation: oscillate 35s infinite; }
        
        @keyframes oscillate {
            0%, 10% { opacity: 0; } 12%, 22% { opacity: 1; } 24%, 100% { opacity: 0; }
        }
        /* Sequence Delay */
        .hero-image:nth-child(1) { animation-delay: 0s; background-image: url('CivitavecchiaCruiseTerminalcruiseship.png'); }
        .hero-image:nth-child(2) { animation-delay: 5s; background-image: url('shipatdock.png'); }
        .hero-image:nth-child(3) { animation-delay: 10s; background-image: url('rcdockatport.png'); }
        .hero-image:nth-child(4) { animation-delay: 15s; background-image: url('terminal-g-renders-2025-04.png'); }
        .hero-image:nth-child(5) { animation-delay: 20s; background-image: url('2000-man.png'); }
        .hero-image:nth-child(6) { animation-delay: 25s; background-image: url('689790780.png'); }
        .hero-image:nth-child(7) { animation-delay: 30s; background-image: url('xvv.png'); }

        .hero-content { position: relative; z-index: 2; color: var(--white); text-align: center; background: rgba(0, 35, 102, 0.7); padding: 40px; }

        /* Content */
        .container { width: 85%; margin: 60px auto; background: var(--white); padding: 80px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .banner-box { width: 100%; text-align: center; margin-bottom: 20px; }
        .banner-box img { max-width: 100%; height: auto; }

        /* Footer Styles */
        footer { background: var(--navy); color: var(--white); padding: 80px 5%; }
        .footer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 40px; }
        /* ... (Keep existing footer grid CSS) ... */
    </style>
</head>
<body>

<header>
    <div class="logo-box"><img src="HarborLinkPartners1.png" alt="HarborLink Partners"></div>
    <nav>

        <a href="logistics.html">Logistics</a><a href="marsec.html">MARSEC</a><a href="iam.html">IAM</a>
    </nav>
</header>

<div class="hero">
    <div class="hero-image"></div><div class="hero-image"></div><div class="hero-image"></div>
    <div class="hero-image"></div><div class="hero-image"></div><div class="hero-image"></div>
    <div class="hero-image"></div>
    <div class="hero-content">
        <h1>Global Maritime Sovereignty</h1>
        <p>The Bureau of Digital Identity: Forensically Hardened Infrastructure.</p>
    </div>
</div>

<div class="container">
    <!-- Rest of your content -->
</div>

<!-- Banner positioned above footer -->
<div class="banner-box">
    <img src="81Nqx.png" alt="Bureau Operational Banner">
</div>

<footer>
    <div class="footer-grid">
        <!-- Footer content remains the same -->
    </div>
</footer>

</body>
</html>
